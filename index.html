<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Budget Tracker System</h1>

      <div class="main">
        <div class="sidebar">
          <div class="card">
            <h3>Add Budget</h3>

            <label for="budgetInput">Budget</label>
            <input
              type="number"
              id="budgetInput"
              placeholder="Enter your budget"
            />

            <button onclick="addBudget()">Add Budget</button>
          </div>

          <div class="card">
            <h3>Add your Expense</h3>

            <label for="expenseTitle">Expense Title: -</label>
            <input type="text" id="expenseTitle" placeholder="Enter expense" />

            <label for="expenseAmount">Amount</label>
            <input
              type="number"
              id="expenseAmount"
              placeholder="Enter amount"
            />

            <button onclick="addExpense()">Add Expense</button>
          </div>

          <button class="reset" onclick="resetAll()">Reset All</button>
        </div>

        <div class="content">
          <div class="summary">
            <div class="summary-box">
              Total Budget:
              <strong id="totalBudget">0.00</strong>
            </div>

            <div class="summary-box">
              Total Expenses:
              <strong id="totalExpenses">0.00</strong>
            </div>

            <div class="summary-box">
              Budget Left:
              <strong id="budgetLeft">0.00</strong>
            </div>
          </div>

          <h3 class="history-title">Expence history</h3>

          <table>
            <thead>
              <tr>
                <th>Expense name</th>
                <th>Amount</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="Expence list"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="./budget.js"></script>
  </body>
</html>
